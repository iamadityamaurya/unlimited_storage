<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Simple vibrant purple-to-indigo gradient -->
    <linearGradient id="folder-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#e747e9ff" />
    </linearGradient>
  </defs>

  <!-- Clean, flat folder shape with rounded corners -->
  <path d="M 64,160 C 64,142 78,128 96,128 L 180,128 C 192,128 202,135 208,144 L 240,192 L 416,192 C 434,192 448,206 448,224 L 448,400 C 448,418 434,432 416,432 L 96,432 C 78,432 64,418 64,400 Z" 
        fill="url(#folder-gradient)" />

  <!-- Minimalist high-contrast white/light blue paper plane -->
  <!-- Left wing -->
  <path d="M 340,220 L 190,300 L 240,315 Z" fill="#ffffff" />
  <!-- Right wing -->
  <path d="M 340,220 L 240,315 L 260,370 Z" fill="#e0e7ff" />
  <!-- Tail fold shadow -->
  <path d="M 240,315 L 260,370 L 248,335 Z" fill="#6366f1" />
</svg>